global:
  scrape_interval: 15s # How often to fetch metrics

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'cambium_router'
    static_configs:
      - targets:
          - '192.168.0.1'  # Router IP
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [public_v1]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'localhost:9116'  # IP:Port of snmp_exporter
